[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ecocausal-reasoner"
version = "0.2.0"
description = "Research prototype: provenance-aware scientific evidence, multi-agent reasoning, synthetic causal tests"
requires-python = ">=3.10"
authors = [{name="Sana Tat"}]
license = "MIT"
dependencies = [
 "numpy>=1.26,<3", "scikit-learn>=1.3,<2", "networkx>=3.1,<4", "rdflib>=7,<8",
 "pydantic>=2.7,<3", "PyMuPDF>=1.24,<2", "scipy>=1.11,<2"
]

[project.optional-dependencies]
semantic = ["sentence-transformers>=3,<6", "faiss-cpu>=1.9"]
transformers = ["transformers>=4.44,<5", "torch>=2.2", "datasets>=3,<5", "accelerate>=1,<2", "pillow>=10"]
finetune = ["transformers>=4.44,<5", "torch>=2.2", "peft>=0.12,<1", "accelerate>=1,<2"]
causal = ["dowhy>=0.12", "pandas>=2.0", "statsmodels>=0.14"]
dev = ["pytest>=8,<10"]

[project.scripts]
ecocausal = "ecocausal.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
