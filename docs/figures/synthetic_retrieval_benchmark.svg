<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="440" viewBox="0 0 1160 440" role="img"><title>Retrieval benchmark on hand-constructed synthetic fixtures</title><desc>Three hand-authored questions score Recall at five of one, while five adversarial hard-negative questions return no documents. These metrics do not generalize to real articles.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0e172a"/><stop offset="1" stop-color="#162948"/></linearGradient><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M1 1 L7 4.5 L1 8" fill="none" stroke="#8bbcf8" stroke-width="1.5"/></marker></defs><style>text{font-family:Inter,Arial,sans-serif;fill:#ecf4ff}.muted{fill:#a2b5d4}.small{font-size:17px}.tiny{font-size:14px}.label{font-size:15px;letter-spacing:1.5px;font-weight:700}.major{font-size:27px;font-weight:750}</style><rect width="1160" height="440" rx="22" fill="url(#bg)"/><text x="38" y="54" class="major">Retrieval benchmark</text><text x="38" y="84" class="small muted">Offline lexical baseline / hand-constructed synthetic evaluation</text>
<text x="48" y="133" class="label" style="fill:#80dcbd">RECALL@5</text><text x="778" y="133" class="label" style="fill:#f4c17d">HARD-NEGATIVE ABSTENTION</text>
