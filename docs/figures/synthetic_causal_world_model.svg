<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="478" viewBox="0 0 1160 478" role="img"><title>Synthetic causal effect and world-model benchmark</title><desc>A synthetic structural causal model with true intervention effect 3.20 has estimated effect 3.241 and bootstrap 95 percent interval 3.065 to 3.417. The synthetic world model has one-step RMSE 0.344 compared with 0.408 for persistence.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0e172a"/><stop offset="1" stop-color="#162948"/></linearGradient><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M1 1 L7 4.5 L1 8" fill="none" stroke="#8bbcf8" stroke-width="1.5"/></marker></defs><style>text{font-family:Inter,Arial,sans-serif;fill:#ecf4ff}.muted{fill:#a2b5d4}.small{font-size:17px}.tiny{font-size:14px}.label{font-size:15px;letter-spacing:1.5px;font-weight:700}.major{font-size:27px;font-weight:750}</style><rect width="1160" height="478" rx="22" fill="url(#bg)"/><text x="38" y="55" class="major">Synthetic causal and world-model checks</text><text x="38" y="85" class="small muted">Results from results/simulation.json / no empirical lake measurements</text>
<text x="54" y="142" class="label" style="fill:#80dcbd">SCM / INTERVENTION EFFECT</text>
<line x1="150" y1="242" x2="990" y2="242" stroke="#52698a" stroke-width="3"/>
<line x1="150" y1="236" x2="150" y2="248" stroke="#8fa5c4" stroke-width="2"/><text x="150" y="273" text-anchor="middle" class="tiny muted">2.8</text><line x1="360" y1="236" x2="360" y2="248" stroke="#8fa5c4" stroke-width="2"/><text x="360" y="273" text-anchor="middle" class="tiny muted">3.0</text><line x1="570" y1="236" x2="570" y2="248" stroke="#8fa5c4" stroke-width="2"/><text x="570" y="273" text-anchor="middle" class="tiny muted">3.2</text><line x1="780" y1="236" x2="780" y2="248" stroke="#8fa5c4" stroke-width="2"/><text x="780" y="273" text-anchor="middle" class="tiny muted">3.4</text><line x1="990" y1="236" x2="990" y2="248" stroke="#8fa5c4" stroke-width="2"/><text x="990" y="273" text-anchor="middle" class="tiny muted">3.6</text>
<line x1="570" y1="160" x2="570" y2="233" stroke="#f4c17d" stroke-width="3" stroke-dasharray="6 6"/>
