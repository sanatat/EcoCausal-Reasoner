<text x="545" y="162" text-anchor="end" font-size="16" style="fill:#f4c17d">True ATE: 3.200</text>
<text x="631" y="190" font-size="16" style="fill:#ecf4ff">Estimated: 3.241</text>
<text x="54" y="300" class="tiny muted">95% bootstrap interval: [3.065, 3.417]  |  absolute error: 0.041</text>
