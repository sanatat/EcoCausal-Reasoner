<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="502" viewBox="0 0 1160 502" role="img"><title>EcoCausal-Reasoner research workflow</title><desc>Source inputs to lexical retrieval to deterministic multi-role agent workflow to audited outputs, with distinct RDF evidence graph, synthetic causal analysis and world-model modules.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0e172a"/><stop offset="1" stop-color="#162948"/></linearGradient><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M1 1 L7 4.5 L1 8" fill="none" stroke="#8bbcf8" stroke-width="1.5"/></marker></defs><style>text{font-family:Inter,Arial,sans-serif;fill:#ecf4ff}.muted{fill:#a2b5d4}.small{font-size:17px}.tiny{font-size:14px}.label{font-size:15px;letter-spacing:1.5px;font-weight:700}.major{font-size:27px;font-weight:750}</style><rect width="1160" height="502" fill="url(#bg)" rx="22"/><text x="38" y="54" class="major">EcoCausal-Reasoner</text><text x="38" y="84" class="small muted">Evidence-first scientific reasoning workflow</text>
<rect x="36" y="123" width="251" height="123" rx="16" fill="#1d2d4c" stroke="#65c6ee" stroke-width="1.5"/><text x="56" y="151" class="label" fill="#65c6ee" style="fill:#65c6ee">01 / SOURCES</text><text x="56" y="185" font-weight="750" font-size="20">Research inputs</text><text x="56" y="211" class="tiny muted">PDF, CSV, OpenAlex metadata</text><text x="56" y="232" class="tiny muted">Demo corpus: synthetic</text>
<rect x="327" y="123" width="251" height="123" rx="16" fill="#1d2d4c" stroke="#80dcbd" stroke-width="1.5"/><text x="347" y="151" class="label" fill="#80dcbd" style="fill:#80dcbd">02 / RETRIEVAL</text><text x="347" y="185" font-weight="750" font-size="20">Hybrid lexical search</text><text x="347" y="211" class="tiny muted">BM25 + TF-IDF</text><text x="347" y="232" class="tiny muted">Dense RAG: optional, not run</text>
<rect x="618" y="123" width="251" height="123" rx="16" fill="#1d2d4c" stroke="#f4c17d" stroke-width="1.5"/><text x="638" y="151" class="label" fill="#f4c17d" style="fill:#f4c17d">03 / MULTI-ROLE</text><text x="638" y="185" font-weight="750" font-size="20">Agent coordinator</text><text x="638" y="211" class="tiny muted">Plan / retrieve / extract / critic</text><text x="638" y="232" class="tiny muted">Offline: deterministic roles</text>
<rect x="909" y="123" width="215" height="123" rx="16" fill="#1d2d4c" stroke="#b4a1f0" stroke-width="1.5"/><text x="929" y="151" class="label" fill="#b4a1f0" style="fill:#b4a1f0">04 / REPORT</text><text x="929" y="185" font-weight="750" font-size="20">Audited output</text><text x="929" y="211" class="tiny muted">Evidence IDs, citations</text><text x="929" y="232" class="tiny muted">Trace + limitations</text>
<g stroke="#8bbcf8" stroke-width="2.2" marker-end="url(#arrow)" fill="none"><path d="M291 185 L319 185"/><path d="M582 185 L610 185"/><path d="M873 185 L901 185"/></g>
<path d="M747 247 L747 285" stroke="#8bbcf8" stroke-width="2" marker-end="url(#arrow)" fill="none"/>
<rect x="38" y="308" width="335" height="110" rx="16" fill="#1d2d4c" stroke="#65c6ee" stroke-width="1.5"/><text x="58" y="336" class="label" fill="#65c6ee" style="fill:#65c6ee">OUTPUT A / PROVENANCE</text><text x="58" y="370" font-weight="750" font-size="20">RDF evidence graph</text><text x="58" y="396" class="tiny muted">RDFLib + SPARQL + PROV-O</text><text x="58" y="417" class="tiny muted">Source-linked candidate relations</text>
<rect x="413" y="308" width="335" height="110" rx="16" fill="#1d2d4c" stroke="#80dcbd" stroke-width="1.5"/><text x="433" y="336" class="label" fill="#80dcbd" style="fill:#80dcbd">OUTPUT B / CAUSAL TEST</text><text x="433" y="370" font-weight="750" font-size="20">Synthetic SCM</text><text x="433" y="396" class="tiny muted">Assumed DAG, do-intervention</text><text x="433" y="417" class="tiny muted">Bootstrap intervals; known truth</text>
<rect x="788" y="308" width="335" height="110" rx="16" fill="#1d2d4c" stroke="#f4c17d" stroke-width="1.5"/><text x="808" y="336" class="label" fill="#f4c17d" style="fill:#f4c17d">OUTPUT C / DYNAMICS</text><text x="808" y="370" font-weight="750" font-size="20">Synthetic world model</text><text x="808" y="396" class="tiny muted">Action-conditioned Ridge model</text><text x="808" y="417" class="tiny muted">One-step and rollout evaluation</text>
<text x="39" y="465" class="small" style="fill:#f4c17d;font-weight:700">RESEARCH PROTOTYPE</text><text x="280" y="465" class="small muted">No real-lake causal conclusions; live LLM modules require separate runs.</text></svg>
